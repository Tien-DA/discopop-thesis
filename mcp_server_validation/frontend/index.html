<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP Benchmark UI</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>MCP Benchmark UI</h1>
        
        <!-- Step 1: LLM Connection -->
        <div id="connection-step" class="step active">
            <h2>Step 1: LLM Connection</h2>
            <div class="form-group">
                <label for="serverUrl">Server URL:</label>
                <input type="text" id="serverUrl" placeholder="http://localhost:18000/v1" value="http://localhost:18000/v1">
            </div>
            <div class="form-group">
                <label for="apiKey">API Key:</label>
                <input type="password" id="apiKey" placeholder="Enter your API key">
            </div>
            <div class="form-group">
                <label for="model">Model:</label>
                <select id="model">
                    <option value="Qwen/Qwen3-Coder-30B-A3B-Instruct">Qwen3-Coder-30B-A3B-Instruct</option>
                </select>
            </div>
            <button id="testConnectionBtn" onclick="testConnection()">Test Connection</button>
            <div id="connectionStatus"></div>
        </div>

        <!-- Step 2: Benchmark Configuration -->
        <div id="configuration-step" class="step">
            <h2>Step 2: Benchmark Configuration</h2>
            <div class="form-group">
                <label for="benchmarkCase">Benchmark Case:</label>
                <select id="benchmarkCase">
                    <!-- Options will be populated by JavaScript -->
                </select>
            </div>
            <div class="form-group">
                <label for="runsCount">Number of runs:</label>
                <input type="number" id="runsCount" value="3" min="1">
            </div>
            <div class="form-group">
                <label for="maxSteps">Max MCP steps:</label>
                <input type="number" id="maxSteps" value="6" min="0">
            </div>
            <button onclick="showMCPStep()">Next</button>
        </div>

        <!-- Step 3: MCP Servers -->
        <div id="mcp-step" class="step">
            <h2>Step 3: MCP Servers</h2>
            <div id="mcpServersContainer">
                <!-- MCP server options will be populated by JavaScript -->
            </div>
            <button onclick="runBenchmark()">Run Benchmark</button>
        </div>

        <!-- Results Section -->
        <div id="results-step" class="step">
            <h2>Benchmark Results</h2>
            <div id="resultsContainer">
                <!-- Results will be displayed here -->
            </div>
            <button onclick="restartBenchmark()">Run Again</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
